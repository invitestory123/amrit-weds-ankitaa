<!-- Ambient Wedding Music: Tum Prem Ho -->
<div id="music-control">
  <audio id="wedding-audio" src="./editable/assets/tum_prem_ho.mp3" loop preload="auto"></audio>
  <button id="music-btn" type="button" aria-label="Toggle background music" title="Tum Prem Ho">
    <svg class="music-disc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 2a10 10 0 0 1 10 10" stroke="#e1be78" stroke-width="2.5"></path>
    </svg>
    <span id="music-label">Tum Prem Ho</span>
  </button>
</div>

<script>
  (function() {
    var audio = document.getElementById('wedding-audio');
    var btn = document.getElementById('music-btn');
    var label = document.getElementById('music-label');
    var isStarted = false;

    function playAudio() {
      if (!audio) return;
      audio.play().then(function() {
        btn.classList.add('playing');
        label.textContent = 'Tum Prem Ho ♫';
      }).catch(function() {
        // Autoplay policy prevented playback until user interaction
      });
    }

    function toggleAudio() {
      if (!audio) return;
      if (audio.paused) {
        audio.play().then(function() {
          btn.classList.add('playing');
          label.textContent = 'Tum Prem Ho ♫';
        });
      } else {
        audio.pause();
        btn.classList.remove('playing');
        label.textContent = 'Music Paused';
      }
    }

    if (btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleAudio();
      });
    }

    // Auto-trigger on first interaction
    function onFirstInteract() {
      if (!isStarted) {
        isStarted = true;
        playAudio();
      }
      window.removeEventListener('pointerdown', onFirstInteract);
      window.removeEventListener('touchstart', onFirstInteract);
      window.removeEventListener('keydown', onFirstInteract);
    }
    window.addEventListener('pointerdown', onFirstInteract);
    window.addEventListener('touchstart', onFirstInteract);
    window.addEventListener('keydown', onFirstInteract);
  })();
</script>
